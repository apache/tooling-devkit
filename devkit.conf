# The names this repository gives what the shared scripts make and read.
# One KEY=value to a line, read with sed and never sourced: the guard reads it too, and
# must not run a file of the repository it is guarding.
#
# The kit's own copy. It names what the kit's tests run against; a service repository has
# its own, which `devkit-sync.sh` leaves alone.

# Prefixes the image, volumes, containers and networks, and names the container's working
# directory, /run/<service>.
DEVKIT_SERVICE=devkit
# The repository, as `owner/name`, where a script has to name it without a git remote.
DEVKIT_REPOSITORY=apache/tooling-devkit
